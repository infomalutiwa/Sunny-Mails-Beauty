<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Termine – Wohlfühlraum Sunny</title>
<style>
:root{--ink:#3b2a20;--mut:#8a7769;--gold:#b98a4e;--gold-l:#d9b57c;--sand:#efe3d3;--blush:#f4e4dc;--bg:#fbf8f3;--line:#eadfd1;--ok:#4f8a5b}
*{box-sizing:border-box;margin:0}
body{font:400 16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);min-height:100vh;
background:radial-gradient(900px 500px at 12% -10%,#f6dfcf 0,transparent 60%),radial-gradient(800px 500px at 100% 0,#efe3d3 0,transparent 55%),var(--bg)}
button,input{font:inherit;color:inherit}
.hide{display:none!important}
.serif{font-family:Georgia,"Times New Roman",serif;font-weight:400}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px;perspective:1100px}
.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);
box-shadow:0 40px 70px -40px rgba(59,42,32,.55),0 2px 0 rgba(255,255,255,.8) inset;border-radius:28px}
#lcard{width:min(420px,100%);padding:38px 34px;transform-style:preserve-3d;transition:transform .15s ease-out}
#lcard h1{font-size:2rem;margin:6px 0 4px}
#lcard p{color:var(--mut);margin-bottom:22px}
.logo{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold-l),var(--gold));color:#fff;font:400 1.7rem Georgia,serif;box-shadow:0 14px 24px -12px rgba(185,138,78,.9);transform:translateZ(40px)}
label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:0;transition:.2s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 4px rgba(185,138,78,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:0;border-radius:999px;background:var(--ink);color:#fff;cursor:pointer;transition:.2s;font-weight:500}
.btn:hover{background:var(--gold);transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:#fff;border-color:var(--gold);color:var(--ink)}
.btn.wide{width:100%;margin-top:22px}
.err{color:#b3402f;font-size:.92rem;margin-top:12px;min-height:1.3em}
.err.ok{color:var(--ok)}
.lnk{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;margin-top:14px;font-size:.9rem}

/* App */
#app{display:grid;grid-template-columns:230px 340px 1fr;gap:18px;height:100vh;padding:18px}
#app>*{min-height:0}
aside.glass{padding:24px 18px;display:flex;flex-direction:column;gap:6px}
aside .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
aside .brand b{font:400 1.2rem/1.1 Georgia,serif;display:block}
aside .brand small{font-size:.65rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
aside .logo{width:42px;height:42px;font-size:1.3rem;transform:none}
.nav{display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 14px;border:0;border-radius:14px;background:transparent;cursor:pointer;text-align:left;transition:.2s}
.nav:hover{background:rgba(255,255,255,.8);transform:translateX(3px)}
.nav.on{background:#fff;box-shadow:0 10px 22px -14px rgba(59,42,32,.6);color:var(--gold);font-weight:500}
.nav i{font-style:normal;font-size:.78rem;background:var(--gold);color:#fff;border-radius:999px;padding:1px 9px;min-width:22px;text-align:center}
.nav i:empty,.nav i[data-n="0"]{display:none}
aside .sp{flex:1}
aside .who{font-size:.8rem;color:var(--mut);word-break:break-all;padding:0 6px 8px}

#list{display:flex;flex-direction:column;overflow:hidden}
#list .top{padding:18px 18px 12px}
#list h2{font-size:1.5rem;margin-bottom:10px}
#q{padding:11px 14px}
#items{overflow:auto;padding:6px 12px 14px;display:flex;flex-direction:column;gap:10px;perspective:900px}
.item{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:#fff;cursor:pointer;
transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;transform-origin:left center}
.item:hover{transform:rotateY(-5deg) translateZ(14px) translateX(4px);box-shadow:14px 18px 30px -20px rgba(59,42,32,.6)}
.item.on{border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,138,78,.15)}
.item .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item b{font-weight:500}
.item.unread b::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--gold);margin-right:8px}
.item time{font-size:.78rem;color:var(--mut);white-space:nowrap}
.item .s{color:var(--mut);font-size:.9rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:var(--mut);text-align:center;padding:50px 20px}

#view{padding:34px clamp(20px,3vw,44px);overflow:auto;perspective:1200px}
#view .ph{height:100%;display:grid;place-items:center;color:var(--mut);text-align:center}
.mail{transform-origin:50% 0;animation:flip .5s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{opacity:0;transform:rotateX(-14deg) translateY(14px)}to{opacity:1;transform:none}}
.mail h2{font-size:clamp(1.7rem,2.6vw,2.4rem);margin:4px 0 4px}
.mail .meta{color:var(--mut);margin-bottom:26px}
.mail dl{display:grid;grid-template-columns:130px 1fr;gap:0;border-top:1px solid var(--ink)}
.mail dt,.mail dd{padding:14px 0;border-bottom:1px solid var(--line)}
.mail dt{color:var(--mut);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;padding-top:17px}
.mail dd{word-break:break-word;white-space:pre-wrap}
.mail .act{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;background:var(--blush);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--gold)}
.back{display:none}
.dh{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin:10px 4px 0}
.item.blk{background:repeating-linear-gradient(135deg,#fff 0 10px,#f7f1ea 10px 20px)}
#view label{margin-top:16px}

@media(max-width:1000px){#app{grid-template-columns:200px 1fr}#view{position:fixed;inset:0;z-index:20;background:var(--bg);border-radius:0}#view.closed{display:none}
.back{display:inline-flex;margin-bottom:14px}}
@media(max-width:640px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100vh;padding:10px;gap:10px}
aside.glass{flex-direction:row;overflow-x:auto;padding:10px;align-items:center}aside .brand,aside .who,aside .sp{display:none}.nav{width:auto;white-space:nowrap}
.mail dl{grid-template-columns:1fr}.mail dt{border:0;padding-bottom:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="login">
  <form id="lcard" class="glass" autocomplete="on">
    <div class="logo">W</div>
    <h1 class="serif">Postfach</h1>
    <p>Anfragen von Wohlfühlraum Sunny. Nur für das Studio.</p>
    <label for="em">E-Mail</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Passwort</label><input id="pw" type="password" autocomplete="current-password" minlength="8" required>
    <button class="btn wide" id="go" type="submit">Anmelden</button>
    <div class="err" id="lerr" role="alert"></div>
    <button class="lnk" id="reg" type="button">Erster Zugang? Konto anlegen</button>
    <button class="lnk" id="rst" type="button">Passwort vergessen</button>
  </form>
</section>

<main id="app" class="hide">
  <aside class="glass">
    <div class="brand"><div class="logo">W</div><div><b>Wohlfühlraum Sunny</b><small>Postfach</small></div></div>
    <button class="nav on" data-f="termine">Termine <i id="n-termine"></i></button>
    <button class="nav" data-f="inbox">Anfragen <i id="n-inbox"></i></button>
    <button class="nav" data-f="unread">Ungelesen <i id="n-unread"></i></button>
    <button class="nav" data-f="archiv">Archiv <i id="n-archiv"></i></button>
    <button class="btn ghost" id="blk" type="button" style="margin-top:14px">Zeit blockieren</button>
    <button class="btn ghost" id="ntf" type="button">Benachrichtigungen an</button>
    <div class="sp"></div>
    <div class="who" id="who"></div>
    <button class="btn ghost" id="out">Abmelden</button>
  </aside>
  <section id="list" class="glass">
    <div class="top"><h2 class="serif" id="ltitle">Termine</h2><input id="q" type="search" placeholder="Suchen …"></div>
    <div id="items"></div>
  </section>
  <section id="view" class="glass closed"><div class="ph">Wähle links einen Termin.</div></section>
</main>

<script type="module">
const V='https://www.gstatic.com/firebasejs/10.12.2/';
const {initializeApp}=await import(V+'firebase-app.js');
const A=await import(V+'firebase-auth.js');
const F=await import(V+'firebase-firestore.js');
const app=initializeApp({apiKey:'AIzaSyDuomvaRRV4VYJYXDs1qE8J0_81gpjRAAs',authDomain:'sunny-mails-beauty.firebaseapp.com',projectId:'sunny-mails-beauty',appId:'1:680567722635:web:524f2428c35df8c1ddba8e'});
const auth=A.getAuth(app),db=F.getFirestore(app);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* 3D-Neigung der Login-Karte */
const lc=$('#lcard');
$('#login').addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*2,y=(e.clientY/innerHeight-.5)*2;lc.style.transform=`rotateY(${x*7}deg) rotateX(${-y*7}deg)`});

/* Anmeldung */
const lerr=$('#lerr'),msg=(t,ok)=>{lerr.textContent=t;lerr.classList.toggle('ok',!!ok)};
const nice=e=>({'auth/invalid-credential':'E-Mail oder Passwort stimmt nicht.','auth/email-already-in-use':'Für diese E-Mail gibt es schon ein Konto. Bitte anmelden.','auth/weak-password':'Das Passwort braucht mindestens 8 Zeichen.','auth/too-many-requests':'Zu viele Versuche. Bitte kurz warten.'}[e.code]||'Das hat nicht geklappt.');
$('#lcard').onsubmit=async e=>{e.preventDefault();msg('');try{await A.signInWithEmailAndPassword(auth,$('#em').value,$('#pw').value)}catch(x){msg(nice(x))}};
$('#reg').onclick=async()=>{msg('');try{const c=await A.createUserWithEmailAndPassword(auth,$('#em').value,$('#pw').value);await A.sendEmailVerification(c.user);msg('Bestätigungsmail gesendet. Link anklicken, dann hier neu anmelden.',true);await A.signOut(auth)}catch(x){msg(nice(x))}};
$('#rst').onclick=async()=>{if(!$('#em').value){msg('Bitte E-Mail eintragen.');return}try{await A.sendPasswordResetEmail(auth,$('#em').value);msg('Mail zum Zurücksetzen ist unterwegs.',true)}catch(x){msg(nice(x))}};
$('#out').onclick=()=>A.signOut(auth);

/* Posteingang */
let all=[],bk=[],filter='termine',sel=null,unsub=null,unsubT=null,first=true;
const when=d=>{if(!d)return'';const t=d.toDate?d.toDate():d,n=new Date(),same=t.toDateString()===n.toDateString();return same?t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'}):t.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
const full=d=>d?(d.toDate?d.toDate():d).toLocaleString('de-DE',{dateStyle:'full',timeStyle:'short'}):'';
function render(){
  renderCount();if(filter==='termine'){renderT();return}
  const q=$('#q').value.toLowerCase();
  $('#n-inbox').textContent=all.filter(m=>m.status!=='archiv').length||'';
  $('#n-unread').textContent=all.filter(m=>m.status==='neu').length||'';
  $('#n-archiv').textContent=all.filter(m=>m.status==='archiv').length||'';
  const rows=all.filter(m=>filter==='archiv'?m.status==='archiv':filter==='unread'?m.status==='neu':m.status!=='archiv')
    .filter(m=>!q||[m.name,m.service,m.note,m.email,m.phone].join(' ').toLowerCase().includes(q));
  $('#items').innerHTML=rows.length?rows.map(m=>`<button class="item ${m.status==='neu'?'unread':''} ${sel===m.id?'on':''}" data-id="${m.id}"><div class="r1"><b>${esc(m.name)}</b><time>${when(m.createdAt)}</time></div><div class="s">${esc(m.service)} · ${esc(m.when)}</div></button>`).join(''):'<div class="empty">Keine Anfragen.</div>';
  if(sel&&!all.find(m=>m.id===sel))close();
}

/* ===== Termine (Direktbuchungen) ===== */
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const dayTxt=d=>new Date(d+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
const todayIso=()=>{const n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0')};
function renderCount(){$('#n-termine').textContent=bk.filter(b=>b.date>=todayIso()&&b.status==='gebucht').length||''}
function renderT(){
  const q=$('#q').value.toLowerCase(),t=todayIso();
  const rows=bk.filter(b=>b.date>=t).filter(b=>!q||[b.name,b.phone,(b.services||[]).join(' '),b.note].join(' ').toLowerCase().includes(q));
  let last='';
  $('#items').innerHTML=rows.length?rows.map(b=>{const h=b.date!==last?`<div class="dh">${new Date(b.date+'T00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})}</div>`:'';last=b.date;
    return h+`<button class="item ${b.status==='blockiert'?'blk':''} ${sel===b.id?'on':''}" data-id="${b.id}"><div class="r1"><b>${hm(b.start)}–${hm(b.end)}</b><time>${b.status==='blockiert'?'blockiert':esc(b.name)}</time></div><div class="s">${b.status==='blockiert'?esc(b.name||'Gesperrt'):esc((b.services||[]).join(', '))}</div></button>`}).join(''):'<div class="empty">Keine kommenden Termine.</div>';
  if(sel&&!bk.find(b=>b.id===sel))close();
}
async function cancelT(b){
  const sl=await F.getDocs(F.query(F.collection(db,'slots'),F.where('b','==',b.id)));
  const w=F.writeBatch(db);sl.docs.forEach(d=>w.delete(d.ref));w.delete(F.doc(db,'termine',b.id));await w.commit();
}
function openT(id){
  const b=bk.find(x=>x.id===id);if(!b)return;sel=id;
  const tel=(b.phone||'').replace(/[^\d+]/g,''),wa=tel?tel.replace(/^00/,'').replace(/^0/,'49').replace(/^\+/,''):'';
  const when=new Date(b.date+'T00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'})+', '+hm(b.start)+'–'+hm(b.end)+' Uhr';
  const text=encodeURIComponent(`Hallo ${b.name}, dein Termin im Wohlfühlraum Sunny: ${when}. Wir freuen uns auf dich!`);
  $('#view').classList.remove('closed');
  $('#view').innerHTML=`<div class="mail"><button class="btn ghost back" id="bk">← Zurück</button><span class="tag">${b.status==='blockiert'?'Blockiert':'Gebucht'}</span><h2 class="serif">${esc(b.status==='blockiert'?(b.name||'Gesperrt'):b.name)}</h2><div class="meta">${esc(when)}${b.createdAt?' · gebucht '+esc(full(b.createdAt)):''}</div>
  <dl>${b.status==='blockiert'?'':`<dt>Leistungen</dt><dd>${esc((b.services||[]).join('\n'))}</dd><dt>Dauer</dt><dd>${b.minutes} Min.</dd><dt>Preis</dt><dd>${b.price!=null?b.price+' €':'nach Behandlung'}</dd><dt>Telefon</dt><dd>${esc(b.phone)||'–'}</dd><dt>E-Mail</dt><dd>${esc(b.email)||'–'}</dd><dt>Notiz</dt><dd>${esc(b.note)||'–'}</dd>`}</dl>
  <div class="act">${wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${text}">WhatsApp</a>`:''}${tel?`<a class="btn ghost" href="tel:${tel}">Anrufen</a>`:''}<button class="btn ghost" id="cx">${b.status==='blockiert'?'Freigeben':'Termin stornieren'}</button></div></div>`;
  $('#cx').onclick=async()=>{if(!confirm(b.status==='blockiert'?'Zeit wieder freigeben?':'Termin stornieren? Die Zeit wird wieder online buchbar. Bitte informiere die Kundin.'))return;try{await cancelT(b)}catch(x){alert('Das hat nicht geklappt.')}};
  $('#bk').onclick=close;render();
}
$('#blk').onclick=()=>{
  sel=null;$('#view').classList.remove('closed');
  $('#view').innerHTML=`<form class="mail" id="bf"><button class="btn ghost back" type="button" id="bk">← Zurück</button><span class="tag">Zeit blockieren</span><h2 class="serif">Zeit sperren</h2><div class="meta">Für Urlaub, Pausen oder telefonisch vereinbarte Termine. Diese Zeit ist dann online nicht buchbar.</div>
  <label for="bd">Tag</label><input id="bd" type="date" required min="${todayIso()}">
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div><label for="bf1">Von</label><input id="bf1" type="time" step="900" value="08:00" required></div><div><label for="bt1">Bis</label><input id="bt1" type="time" step="900" value="20:00" required></div></div>
  <label for="br">Grund / Name</label><input id="br" type="text" placeholder="z. B. Urlaub oder Frau Müller (telefonisch)">
  <div class="act"><button class="btn" type="submit">Sperren</button></div><div class="err" id="berr"></div></form>`;
  $('#bk').onclick=close;
  $('#bf').onsubmit=async e=>{e.preventDefault();
    const d=$('#bd').value,tm=v=>{const[a,b]=v.split(':').map(Number);return a*60+b};
    let s0=Math.floor(tm($('#bf1').value)/15)*15,e0=Math.ceil(tm($('#bt1').value)/15)*15;
    if(!d||e0<=s0){$('#berr').textContent='Bitte Tag und gültige Zeiten wählen.';return}
    const ex=await F.getDocs(F.query(F.collection(db,'slots'),F.where('d','==',d)));const taken=new Set(ex.docs.map(x=>x.data().m));
    const ref=F.doc(F.collection(db,'termine')),w=F.writeBatch(db);
    w.set(ref,{name:$('#br').value.trim()||'Gesperrt',date:d,start:s0,end:e0,minutes:e0-s0,status:'blockiert',createdAt:F.serverTimestamp()});
    for(let m=s0;m<e0;m+=15)if(!taken.has(m))w.set(F.doc(db,'slots',d+'_'+m),{d,m,b:ref.id});
    try{await w.commit();$('#berr').classList.add('ok');$('#berr').textContent='Gesperrt.'+(taken.size?' Bereits gebuchte Zeiten bleiben bestehen.':'')}catch(x){$('#berr').textContent='Das hat nicht geklappt.'}
  };
};
/* Benachrichtigung bei neuer Buchung, solange diese Seite offen ist (auch als App auf dem Homescreen) */
const ntfBtn=$('#ntf');
const ntfState=()=>{if(!('Notification' in window)){ntfBtn.classList.add('hide');return}ntfBtn.textContent=Notification.permission==='granted'?'Benachrichtigungen aktiv':'Benachrichtigungen an';ntfBtn.disabled=Notification.permission==='granted'};
ntfBtn.onclick=async()=>{await Notification.requestPermission();ntfState()};ntfState();
function ping(b){
  const txt=`${new Date(b.date+'T00:00').toLocaleDateString('de-DE',{weekday:'short',day:'numeric',month:'short'})}, ${hm(b.start)} Uhr: ${(b.services||[]).join(', ')}`;
  document.title='(Neu) Termine – Wohlfühlraum Sunny';
  if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Neuer Termin: '+b.name,{body:txt,tag:b.id})}catch(e){}}
}
addEventListener('focus',()=>{document.title='Termine – Wohlfühlraum Sunny'});

function open(id){
  const m=all.find(x=>x.id===id);if(!m)return;sel=id;
  if(m.status==='neu')F.updateDoc(F.doc(db,'anfragen',id),{status:'gelesen'});
  const tel=(m.phone||'').replace(/[^\d+]/g,''),wa=tel?tel.replace(/^0/,'49').replace(/^\+/,''):'';
  const text=encodeURIComponent(`Hallo ${m.name}, danke für deine Anfrage (${m.service}, ${m.when}). `);
  $('#view').classList.remove('closed');
  $('#view').innerHTML=`<div class="mail"><button class="btn ghost back" id="bk">← Zurück</button><span class="tag">${m.status==='archiv'?'Archiviert':'Terminanfrage'}</span><h2 class="serif">${esc(m.name)}</h2><div class="meta">${esc(full(m.createdAt))}</div>
  <dl><dt>Leistung</dt><dd>${esc(m.service)}</dd><dt>Wunschtermin</dt><dd>${esc(m.when)}</dd><dt>Telefon</dt><dd>${esc(m.phone)||'–'}</dd><dt>E-Mail</dt><dd>${esc(m.email)||'–'}</dd><dt>Notiz</dt><dd>${esc(m.note)||'–'}</dd></dl>
  <div class="act">${wa?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${text}">Per WhatsApp antworten</a>`:''}${m.email?`<a class="btn ${wa?'ghost':''}" href="mailto:${encodeURIComponent(m.email)}?subject=${encodeURIComponent('Dein Termin im Wohlfühlraum Sunny')}&body=${text}">Per E-Mail antworten</a>`:''}${tel?`<a class="btn ghost" href="tel:${tel}">Anrufen</a>`:''}
  <button class="btn ghost" id="arc">${m.status==='archiv'?'Zurück in Posteingang':'Archivieren'}</button><button class="btn ghost" id="del">Löschen</button></div></div>`;
  $('#arc').onclick=()=>F.updateDoc(F.doc(db,'anfragen',id),{status:m.status==='archiv'?'gelesen':'archiv'});
  $('#del').onclick=()=>{if(confirm('Anfrage endgültig löschen?'))F.deleteDoc(F.doc(db,'anfragen',id))};
  $('#bk').onclick=close;render();
}
function close(){sel=null;$('#view').classList.add('closed');$('#view').innerHTML='<div class="ph">Wähle links '+(filter==='termine'?'einen Termin':'eine Anfrage')+'.</div>';render()}
$('#items').onclick=e=>{const b=e.target.closest('.item');if(b)(filter==='termine'?openT:open)(b.dataset.id)};
$('#q').oninput=render;
$$('.nav').forEach(b=>b.onclick=()=>{filter=b.dataset.f;$$('.nav').forEach(x=>x.classList.toggle('on',x===b));$('#ltitle').textContent=b.firstChild.textContent.trim();close()});

A.onAuthStateChanged(auth,u=>{
  if(unsub){unsub();unsub=null}if(unsubT){unsubT();unsubT=null}first=true;
  const ok=u&&u.emailVerified;
  $('#login').classList.toggle('hide',!!ok);$('#app').classList.toggle('hide',!ok);
  if(u&&!u.emailVerified){msg('Bitte zuerst den Link in der Bestätigungsmail anklicken.');A.signOut(auth);return}
  if(!ok)return;
  $('#who').textContent=u.email;
  unsubT=F.onSnapshot(F.query(F.collection(db,'termine'),F.where('date','>=',todayIso())),s=>{
    if(!first)s.docChanges().forEach(c=>{if(c.type==='added'&&c.doc.data().status==='gebucht')ping(c.doc.data())});first=false;
    bk=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.date.localeCompare(b.date)||a.start-b.start);render()},()=>{});
  unsub=F.onSnapshot(F.query(F.collection(db,'anfragen'),F.orderBy('createdAt','desc')),s=>{all=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    ()=>{$('#items').innerHTML='<div class="empty">Kein Zugriff. Dieses Konto ist nicht für das Postfach freigegeben.</div>'});
});
</script>
